# YAML file for PoolBoiling tests
# comments can be added with "#"

Comparison/incompFlow/FlowBoiling/2d/IO:
  setupOptions: -auto -maxblocks=16 +amrex +parallelIO -2d -nxb=16 -nyb=16 IOWriteGridFiles=True
  parfiles: test_io_2d.par
  transfers: source/Simulation/SimulationMain/incompFlow/FlowBoiling/tests/test_io_2d.py
# YAML file for FlowBoiling tests
# comments can be added with "#"

Comparison/incompFlow/FlowBoiling/2d/AMReX:
  setupOptions: -auto -maxblocks=200 -2d -nxb=16 -nyb=16 +amrex +parallelIO +incomp -tomlfile=tests/test_2d_am.toml HeaterFluxBC=True --with-unitmods
  parfiles: <defaultParfile>
  transfers: object/flow_boiling_hdf5_htr_0001 object/flow_boiling_hdf5_htr_0002

Comparison/incompFlow/FlowBoiling/3d/AMReX:
  setupOptions: -auto -maxblocks=200 -3d -nxb=16 -nyb=16 -nzb=16 +amrex +parallelIO +incomp -tomlfile=tests/test_3d_am.toml HeaterFluxBC=True --with-unitmods
  parfiles: <defaultParfile>
  transfers: object/flow_boiling_hdf5_htr_0001 object/flow_boiling_hdf5_htr_0002
